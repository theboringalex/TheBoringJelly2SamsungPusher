name: TheBoringJelly2SamsungPusher
version: "0.2.1"
slug: theboringjelly2samsungpusher
description: Installs the Jellyfin app on a Samsung Smart TV (Tizen, Developer Mode) with one click
url: https://github.com/theboringalex/TheBoringJelly2SamsungPusher
# The Tizen CLI (sdb/tizen) is only available for x86_64 Linux.
arch:
  - amd64
# The base image is not a Home Assistant base image (no s6/tini needed).
init: false
boot: manual
startup: application
# Operated through the sidebar (Ingress), no exposed port.
ingress: true
ingress_port: 8099
panel_icon: mdi:television-play
panel_title: TheBoringJelly2SamsungPusher
# Optional custom Samsung certificates (author.p12 / distributor.p12) live in
# /addon_configs/<slug>/ on the HA host and appear in the container as /config.
map:
  - addon_config:rw
options:
  tv_ip: ""
  build_variant: Jellyfin
  jellyfin_url: ""
  release_tag: ""
  uninstall_first: false
  launch_after_install: true
  auto_install: false
  certificate_password: ""
  distributor_password: ""
schema:
  tv_ip: str?
  build_variant: list(Jellyfin|Jellyfin-10.11.z|Jellyfin-12.z|Jellyfin-master|Jellyfin-prerelease|Jellyfin-secondary|Jellyfin-OblongIcon|Jellyfin-SmartHub|Jellyfin-OSA|Jellyfin-TrailerFix|Jellyfin-GrayFix|Jellyfin-10.11.z-OSA|Jellyfin-10.11.z-TrailerFix|Jellyfin-12.z-OSA|Jellyfin-12.z-TrailerFix)
  jellyfin_url: str?
  release_tag: str?
  uninstall_first: bool
  launch_after_install: bool
  auto_install: bool
  certificate_password: password?
  distributor_password: password?
